name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache Astro build artifacts
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-

      - run: pnpm run format:check

      - run: pnpm run lint

      - run: pnpm run build
