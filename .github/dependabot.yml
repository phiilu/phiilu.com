version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # tooling: lint/format/types — CI proves it, majors included
      dev:
        dependency-type: 'development'
        patterns: ['*']
      prod:
        dependency-type: 'production'
        patterns: ['*']
        update-types: ['minor', 'patch']
      prod-major:
        dependency-type: 'production'
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
